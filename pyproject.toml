[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "afrogeo"
version = "0.2.0"
description = "Offline-first African location verification for Python."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
  { name = "404Codes" }
]
keywords = [
  "africa",
  "geography",
  "verification",
  "offline",
  "nigeria",
  "gis",
  "location"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: GIS",
  "Typing :: Typed"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/404codess/afrogeo"
Repository = "https://github.com/404codess/afrogeo"
Issues = "https://github.com/404codess/afrogeo/issues"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "build",
  "twine"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["afrogeo*"]
exclude = ["data*", "tests*", "scripts*", "examples*"]

[tool.setuptools.package-data]
afrogeo = ["data/*.json", "py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["afrogeo"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
